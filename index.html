/* Keep the sky honest if the screen is left open across sunset. */
setInterval(()=>{
  if(weatherScreenOpen && cachedWeather && !cachedWeather.error){
    const band = skyBand(cachedWeather);
    if(band !== weatherScreen.dataset.sky){
      weatherScreen.dataset.sky = band;
      renderCelestial(band, cachedWeather);
    }
  }
}, 60000);

/* ================= Ambient mode ================= */
/* The microphone drives an aurora; the front camera is sampled a few
   times a minute only to read how bright the room is. No audio or
   video is stored, and nothing is sent anywhere — everything stays
   in this tab. */
const ambient = {
  on:false,
  stream:null, source:null, analyser:null, freq:null,
  level:0, bass:0, mid:0,
  camStream:null, camVideo:null, camCanvas:null, camTimer:null,
  brightness:1, targetBrightness:1,
  autoDim:true, sleepNotify:true,
  quietSince:null, asleep:false,
  rafId:null, error:null
};

const QUIET_LEVEL = 0.045;          // below this counts as a quiet room
const QUIET_BEFORE_SLEEP = 30 * 60 * 1000;

const ambientScreen = document.getElementById('ambient-screen');
const ambientCanvas = document.getElementById('ambient-canvas');
const ambientMsg    = document.getElementById('ambient-msg');
const ambientFoot   = document.getElementById('ambient-foot');
const ambientSub    = document.getElementById('ambient-sub');
const ambientState  = document.getElementById('ambient-state');
let ambientScreenOpen = false;

function ambientErrorText(reason){
  if(reason === 'off') return '마이크를 껐습니다';
  if(reason === 'permission') return '마이크 권한이 꺼져 있습니다';
  if(reason === 'unsupported') return '이 브라우저는 마이크를 지원하지 않습니다';
  return '마이크를 열지 못했습니다';
}

/* ---- Microphone ---- */
function startAmbient(){
  if(ambient.on) return Promise.resolve(true);
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    ambient.error = 'unsupported';
    return Promise.resolve(false);
  }
  /* The browser's voice processing fights us here: AGC would flatten
     every room to the same level and noise suppression would erase
     exactly the ambience we want to see. */
  return navigator.mediaDevices.getUserMedia({
    audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false },
    video:false
  }).then(stream=>{
    const c = ctx();
    ambient.stream = stream;
    ambient.source = c.createMediaStreamSource(stream);
    ambient.analyser = c.createAnalyser();
    ambient.analyser.fftSize = 256;
    ambient.analyser.smoothingTimeConstant = 0.75;
    /* Deliberately NOT connected to destination — routing the mic to
       the speakers would howl. */
    ambient.source.connect(ambient.analyser);
    ambient.freq = new Uint8Array(ambient.analyser.frequencyBinCount);
    ambient.on = true;
    ambient.error = null;
    ambient.quietSince = null;
    ambient.asleep = false;
    islandMode = null;
    renderIsland();
    if(ambient.autoDim) startBrightnessSampling();
    return true;
  }).catch(()=>{
    ambient.error = 'permission';
    return false;
  });
}

/* keepScreen is used by the mic-off control: the person asked to
   stop listening, not to leave the view. */
function stopAmbient(keepScreen){
  if(!ambient.on && !ambient.stream) return;
  if(ambient.source){ try{ ambient.source.disconnect(); }catch(e){} }
  if(ambient.stream) ambient.stream.getTracks().forEach(t=>t.stop());
  ambient.stream = null; ambient.source = null; ambient.analyser = null; ambient.freq = null;
  ambient.on = false; ambient.level = 0; ambient.bass = 0; ambient.mid = 0;
  ambient.quietSince = null; ambient.asleep = false;
  stopBrightnessSampling();
  if(ambientState){ ambientState.textContent = ''; lastStateText = ''; }
  if(keepScreen) renderAmbientChrome();
  else closeAmbientScreen();
  islandMode = null;
  renderIsland();
}

/* Averages a slice of the spectrum, 0..1. */
function bandLevel(from, to){
  let sum = 0;
  for(let i=from; i<to; i++) sum += ambient.freq[i];
  return (sum / (to-from)) / 255;
}

/* The pill's meter and the canvas both want the level each frame.
   Without this guard the smoothing would be applied twice per frame
   whenever the full screen is open, making it jumpier there than in
   the pill. */
let lastLevelRead = 0;
function readAmbientLevel(force){
  if(!ambient.analyser) return;
  const now = performance.now();
  if(!force && now - lastLevelRead < 12) return;
  lastLevelRead = now;
  ambient.analyser.getByteFrequencyData(ambient.freq);
  const n = ambient.freq.length;
  const bass = bandLevel(1, Math.floor(n*0.12));
  const mid  = bandLevel(Math.floor(n*0.12), Math.floor(n*0.45));
  const all  = bandLevel(1, Math.floor(n*0.7));
  /* Ease toward the new reading so the aurora drifts instead of
     stuttering frame to frame. */
  ambient.bass  += (bass - ambient.bass) * 0.18;
  ambient.mid   += (mid  - ambient.mid)  * 0.14;
  ambient.level += (all  - ambient.level) * 0.12;
  trackQuiet();
  updateAmbientState();
}

/* Says why the screen went dark, so a dimmed display doesn't just
   look like a bug. */
let lastStateText = '';
function updateAmbientState(){
  if(!ambientState) return;
  let txt = '';
  if(ambient.asleep) txt = '절전 중 · 소리가 나면 깨어납니다';
  else if(ambient.quietSince && Date.now() - ambient.quietSince > 60000){
    const mins = Math.floor((Date.now() - ambient.quietSince) / 60000);
    txt = `${mins}분째 조용함`;
  }
  if(txt !== lastStateText){ lastStateText = txt; ambientState.textContent = txt; }
}

/* ---- Sleep detection ---- */
function trackQuiet(){
  const now = Date.now();
  if(ambient.level < QUIET_LEVEL){
    if(ambient.quietSince === null) ambient.quietSince = now;
    if(!ambient.asleep && ambient.sleepNotify && now - ambient.quietSince > QUIET_BEFORE_SLEEP){
      ambient.asleep = true;
      notifySleep();
    }
  } else {
    ambient.quietSince = null;
    if(ambient.asleep){ ambient.asleep = false; }
  }
}

function notifySleep(){
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  try{
    new Notification('잘 자요', { body:'30분째 조용해서 화면을 어둡게 할게요.', tag:'ambient-sleep' });
  }catch(e){ /* 일부 브라우저는 서비스 워커 없이는 막는다 */ }
}

function requestNotifyPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default') Notification.requestPermission();
}

/* ---- Camera: room brightness only ---- */
function startBrightnessSampling(){
  if(ambient.camTimer !== null) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false })
    .then(stream=>{
      if(!ambient.on || !ambient.autoDim){ stream.getTracks().forEach(t=>t.stop()); return; }
      ambient.camStream = stream;
      const v = document.createElement('video');
      v.autoplay = true; v.muted = true; v.playsInline = true;
      v.setAttribute('playsinline','');
      v.srcObject = stream;
      ambient.camVideo = v;
      /* A 32x24 grab is plenty to average luminance and keeps the
         per-sample cost negligible. */
      const cv = document.createElement('canvas');
      cv.width = 32; cv.height = 24;
      ambient.camCanvas = cv;
      sampleBrightness();
      ambient.camTimer = setInterval(sampleBrightness, 5000);
    })
    .catch(()=>{ /* 카메라를 못 열면 밝기는 그냥 100%로 둔다 */ });
}

function stopBrightnessSampling(){
  if(ambient.camTimer !== null){ clearInterval(ambient.camTimer); ambient.camTimer = null; }
  if(ambient.camStream){ ambient.camStream.getTracks().forEach(t=>t.stop()); ambient.camStream = null; }
  ambient.camVideo = null; ambient.camCanvas = null;
  ambient.targetBrightness = 1;
}

function sampleBrightness(){
  const v = ambient.camVideo, cv = ambient.camCanvas;
  if(!v || !cv || v.readyState < 2) return;
  const g = cv.getContext('2d');
  g.drawImage(v, 0, 0, cv.width, cv.height);
  let sum = 0;
  const d = g.getImageData(0, 0, cv.width, cv.height).data;
  for(let i=0; i<d.length; i+=4){
    sum += 0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2];
  }
  const lum = (sum / (d.length/4)) / 255;
  /* Never go fully black — 0.35 still reads in a dark room. */
  ambient.targetBrightness = 0.35 + Math.min(1, lum*1.9) * 0.65;
}

/* ---- Canvas scene ---- */
const AURORA = [
  { y:0.42, amp:0.055, freq:1.5, speed:0.00013, hue:168, alpha:0.34 },
  { y:0.50, amp:0.075, freq:1.1, speed:-0.00009, hue:196, alpha:0.28 },
  { y:0.58, amp:0.062, freq:1.9, speed:0.00017, hue:274, alpha:0.22 },
];
let ambientStars = [];
let ambientDpr = 1;

function sizeAmbientCanvas(){
  ambientDpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = ambientScreen.clientWidth || window.innerWidth;
  const h = ambientScreen.clientHeight || window.innerHeight;
  ambientCanvas.width = Math.round(w * ambientDpr);
  ambientCanvas.height = Math.round(h * ambientDpr);
  buildAmbientStars();
}

function buildAmbientStars(){
  ambientStars = [];
  const count = 110;
  for(let i=0; i<count; i++){
    ambientStars.push({
      x: Math.random(),
      y: Math.random() * 0.72,
      r: Math.random() * 1.3 + 0.4,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.0016 + 0.0006
    });
  }
}

function drawAmbient(t){
  const g = ambientCanvas.getContext('2d');
  const W = ambientCanvas.width, H = ambientCanvas.height;
  const dpr = ambientDpr;

  readAmbientLevel();
  ambient.brightness += (ambient.targetBrightness - ambient.brightness) * 0.02;
  const sleepDim = ambient.asleep ? 0.22 : 1;
  const lvl = ambient.level;

  g.clearRect(0, 0, W, H);

  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0,    '#04050d');
  sky.addColorStop(0.42, '#0a1130');
  sky.addColorStop(0.75, '#122045');
  sky.addColorStop(1,    '#1b2a55');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  /* Stars brighten as the room gets louder. */
  ambientStars.forEach(st=>{
    const tw = 0.45 + 0.55 * Math.abs(Math.sin(st.phase + t * st.speed));
    g.globalAlpha = Math.min(1, tw * (0.5 + lvl * 1.7));
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.arc(st.x * W, st.y * H, st.r * dpr, 0, Math.PI * 2);
    g.fill();
  });
  g.globalAlpha = 1;

  /* Aurora ribbons. Bass swells them, mids ripple them. */
  g.globalCompositeOperation = 'screen';
  AURORA.forEach((rb, i)=>{
    const amp = H * rb.amp * (0.42 + ambient.bass * 2.6 + lvl * 0.9);
    const baseY = H * rb.y;
    const thickness = H * (0.10 + ambient.mid * 0.13);
    const grad = g.createLinearGradient(0, baseY - thickness, 0, baseY + thickness);
    const a = rb.alpha * (0.35 + lvl * 1.5);
    grad.addColorStop(0,   `hsla(${rb.hue}, 88%, 62%, 0)`);
    grad.addColorStop(0.5, `hsla(${rb.hue}, 88%, 62%, ${a.toFixed(3)})`);
    grad.addColorStop(1,   `hsla(${rb.hue + 26}, 85%, 55%, 0)`);
    g.fillStyle = grad;

    g.beginPath();
    g.moveTo(0, baseY);
    const step = Math.max(6, W / 120);
    for(let x=0; x<=W; x+=step){
      const u = x / W;
      const y = baseY
        + Math.sin(u * Math.PI * 2 * rb.freq + t * rb.speed) * amp
        + Math.sin(u * Math.PI * 2 * (rb.freq * 2.3) + t * rb.speed * 1.7 + i) * amp * 0.35;
      g.lineTo(x, y);
    }
    for(let x=W; x>=0; x-=step){
      const u = x / W;
      const y = baseY + thickness
        + Math.sin(u * Math.PI * 2 * rb.freq + t * rb.speed) * amp
        + Math.sin(u * Math.PI * 2 * (rb.freq * 2.3) + t * rb.speed * 1.7 + i) * amp * 0.35;
      g.lineTo(x, y);
    }
    g.closePath();
    g.fill();
  });
  g.globalCompositeOperation = 'source-over';

  /* Horizon glow, pulsing with the overall level. */
  const glow = g.createLinearGradient(0, H * 0.72, 0, H);
  glow.addColorStop(0, 'rgba(90,150,220,0)');
  glow.addColorStop(1, `rgba(120,175,235,${(0.10 + lvl * 0.3).toFixed(3)})`);
  g.fillStyle = glow;
  g.fillRect(0, H * 0.72, W, H * 0.28);

  /* Auto-dim and sleep are applied as one black veil at the end. */
  const veil = 1 - Math.min(1, ambient.brightness * sleepDim);
  if(veil > 0.001){
    g.fillStyle = `rgba(0,0,0,${veil.toFixed(3)})`;
    g.fillRect(0, 0, W, H);
  }
}

function ambientLoop(t){
  if(!ambientScreenOpen) return;
  drawAmbient(t);
  ambient.rafId = requestAnimationFrame(ambientLoop);
}

/* ---- Screen open/close ---- */
function renderAmbientChrome(){
  const failed = !ambient.on;
  ambientMsg.style.display = failed ? '' : 'none';
  ambientFoot.style.display = failed ? 'none' : '';
  const off = ambient.error === 'off';
  if(failed){
    ambientMsg.innerHTML = `${ambientErrorText(ambient.error)}<br>` + (off
      ? '오로라는 계속 흐릅니다.<br>다시 켜면 소리에 반응합니다.'
      : '미리보기 창에서는 마이크가 막혀 있을 수 있습니다.<br>파일을 브라우저에서 직접 열면 권한을 물어봅니다.')
      + `<button class="ghost-btn retry-btn" id="ambient-retry">마이크 켜기</button>`;
    const r = document.getElementById('ambient-retry');
    if(r) r.addEventListener('click', ()=>{
      r.textContent = '여는 중...'; r.disabled = true;
      startAmbient().then(()=>renderAmbientChrome());
    });
    ambientSub.textContent = off ? '마이크 꺼짐' : '마이크 없이 표시 중';
  } else {
    ambientSub.textContent = '방 안의 소리를 듣는 중';
  }
  const mt = document.getElementById('mic-toggle');
  mt.classList.toggle('off', failed);
  mt.title = failed ? '마이크 켜기' : '마이크 끄기';
  mt.setAttribute('aria-label', mt.title);
  mt.innerHTML = failed
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5A3 3 0 0 1 15 5v5m0 3a3 3 0 0 1-5 2.2"/><path d="M5 11a7 7 0 0 0 10.7 6"/><path d="M19 11a7 7 0 0 1-.3 2"/><path d="M12 18v4"/><path d="M3 2l18 20"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>';
  document.getElementById('chip-autodim').classList.toggle('on', ambient.autoDim);
  document.getElementById('chip-sleep').classList.toggle('on', ambient.sleepNotify);
}

function openAmbientScreen(){
  if(ambientScreenOpen) return;
  ambientScreenOpen = true;
  closeMirror();
  closePanel();
  closeWeatherScreen();
  document.body.classList.add('ambient-open');
  ambientScreen.setAttribute('aria-hidden','false');
  sizeAmbientCanvas();
  renderAmbientChrome();
  ambient.rafId = requestAnimationFrame(ambientLoop);
}

function closeAmbientScreen(){
  if(!ambientScreenOpen) return;
  ambientScreenOpen = false;
  if(ambient.rafId){ cancelAnimationFrame(ambient.rafId); ambient.rafId = null; }
  document.body.classList.remove('ambient-open');
  ambientScreen.setAttribute('aria-hidden','true');
}

document.getElementById('ambient-back').addEventListener('click', (e)=>{
  e.stopPropagation();
  closeAmbientScreen();
});
document.getElementById('mic-toggle').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(ambient.on){
    ambient.error = 'off';
    stopAmbient(true);
  } else {
    startAmbient().then(()=>renderAmbientChrome());
  }
});
document.getElementById('chip-autodim').addEventListener('click', ()=>{
  ambient.autoDim = !ambient.autoDim;
  if(ambient.autoDim) startBrightnessSampling();
  else { stopBrightnessSampling(); ambient.targetBrightness = 1; }
  renderAmbientChrome();
});
document.getElementById('chip-sleep').addEventListener('click', ()=>{
  ambient.sleepNotify = !ambient.sleepNotify;
  if(ambient.sleepNotify) requestNotifyPermission();
  else { ambient.asleep = false; }
  renderAmbientChrome();
});
window.addEventListener('resize', ()=>{ if(ambientScreenOpen) sizeAmbientCanvas(); });

/* The icon button starts listening; once it's running the same
   button jumps straight to the full screen. */
iconBtns.ambient.addEventListener('click', ()=>{
  if(ambientScreenOpen){ closeAmbientScreen(); return; }
  if(ambient.on){ openAmbientScreen(); return; }
  requestNotifyPermission();
  startAmbient().then(()=>openAmbientScreen());
});

/* Idle timekeeping: the sleep check has to keep running even when
   the aurora isn't being drawn. */
setInterval(()=>{
  if(ambient.on && !ambientScreenOpen) readAmbientLevel(true);
}, 400);

/* ================= Boot: 복원 상태 반영 ================= */
/* 브라우저 정책상 사용자 제스처 전에는 소리가 안 나므로, 첫 터치에서 오디오 재개 */
document.addEventListener('pointerdown', ()=>{
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, true);

/* Cameras must not outlive the view that opened them. Closing the
   mirror panel already releases it, but switching tabs does not
   close anything — without this the camera indicator stays lit
   while the person is somewhere else entirely. The ambient
   brightness sampler gets the same treatment; its readings are
   meaningless while hidden anyway. The microphone is left alone on
   purpose, since the quiet-room notification depends on it and the
   mic-off control is always one tap away. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden'){
    closeMirror();
    stopBrightnessSampling();
  } else if(ambient.on && ambient.autoDim){
    startBrightnessSampling();
  }
});
window.addEventListener('pagehide', ()=>{
  closeMirror();
  stopBrightnessSampling();
});

const restoredActive = state.timer.running || state.timer.paused || state.timer.ringing
  || state.stopwatch.running || state.stopwatch.elapsedMs > 0;
if(restoredActive){
  /* 타이머/스톱워치가 살아 있는 채로 돌아왔으면 인트로 없이 바로 표시 */
  document.body.classList.add('clock-ready');
  document.body.classList.add('timer-ready');
  if(state.timer.ringing) playSound(state.timer.sound);
  islandMode = null;
  renderIsland();
} else if(!introAlreadySeen()){
  /* First run: explain the app, then play the loading sequence. Doing
     both at once would hide the pill animation behind the overlay. */
  openOnboard(()=>runIntroStage(0));
} else {
  runIntroStage(0);
}

})();
</script>
