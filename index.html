<script>
(function(){

/* ================= State ================= */
const state = {
  use24h: true,
  showSeconds: true,
  showDate: false,
  flipped: false,
  animStyle: 'pop',
  lastRendered: { h:'', m:'', s:'', ampm:'', dateStr:'' },

  timer: { total:300, remaining:0, endAt:0, running:false, paused:false, ringing:false, sound:'classic' },
  timerMin: 5, timerSec: 0,

  alarms: [], // {id, hour, min, sound, enabled, firing}
  snoozeQueue: [], // {id, at, sound} — 원래 알람 시각은 건드리지 않는다
  alarmHour: 7, alarmMin: 0, alarmSound: 'chime',
  lastMinuteChecked: -1,

  stopwatch: { running:false, elapsedMs:0, startedAt:0, laps:[] },

  memo: '',
  activePanel: null // 'settings'|'music' — the two that are still sheets
};

/* ================= Music state =================
   Declared up here (rather than down with the rest of the player)
   because computeActivities/buildIslandDOM reference it, and those
   are wired before the music section runs.

   tracks[] holds live File/objectURL pairs. Those cannot survive a
   reload -- a File handle is only valid for the page that the user
   picked it in -- so only the preferences below are persisted. */
const music = {
  tracks: [],      // {id, name, url, title, artist, album, art, duration}
  index: -1,
  playing: false,
  el: null,
  srcNode: null, analyser: null, freq: null, wave: null,
  graphFailed: false,
  shuffle: false,
  repeat: 'off',   // 'off' | 'all' | 'one'
  style: 'bars',   // 'bars' | 'mirror' | 'wave'
  artBg: false,
  seq: 1
};

const SPECTRUM_STYLES = [
  { id:'bars',   label:'바' },
  { id:'mirror', label:'미러' },
  { id:'wave',   label:'파형' },
];

const NOTE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
const PREV_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.4v14H6z"/><path d="M20 5.6v12.8a1 1 0 0 1-1.55.83l-9.6-6.4a1 1 0 0 1 0-1.66l9.6-6.4A1 1 0 0 1 20 5.6z"/></svg>`;
const NEXT_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.6 5H18v14h-2.4z"/><path d="M4 5.6v12.8a1 1 0 0 0 1.55.83l9.6-6.4a1 1 0 0 0 0-1.66l-9.6-6.4A1 1 0 0 0 4 5.6z"/></svg>`;
const SHUFFLE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>`;
const REPEAT_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`;
const REPEAT1_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="12" y="15.6" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" stroke="none">1</text></svg>`;

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ================= Persistence (localStorage) ================= */
const STORAGE_KEY = 'dynamicClock.v1';
let persisted = null;
try{ persisted = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }catch(e){ persisted = null; }
if(persisted){
  if(typeof persisted.use24h === 'boolean') state.use24h = persisted.use24h;
  if(typeof persisted.showSeconds === 'boolean') state.showSeconds = persisted.showSeconds;
  if(typeof persisted.showDate === 'boolean') state.showDate = persisted.showDate;
  if(typeof persisted.flipped === 'boolean') state.flipped = persisted.flipped;
  if(persisted.animStyle) state.animStyle = persisted.animStyle;
  if(typeof persisted.timerMin === 'number') state.timerMin = persisted.timerMin;
  if(typeof persisted.timerSec === 'number') state.timerSec = persisted.timerSec;
  if(persisted.timer){
    Object.assign(state.timer, persisted.timer);
    /* 탭이 닫혀 있는 동안 타이머가 끝났으면 재접속 시 바로 벨 상태로 */
    if(state.timer.running && state.timer.endAt <= Date.now()){
      state.timer.running = false;
      state.timer.remaining = 0;
      state.timer.ringing = true;
    }
  }
  if(Array.isArray(persisted.alarms)) state.alarms = persisted.alarms.map(a=>({ ...a, firing:false }));
  if(typeof persisted.alarmHour === 'number') state.alarmHour = persisted.alarmHour;
  if(typeof persisted.alarmMin === 'number') state.alarmMin = persisted.alarmMin;
  if(persisted.alarmSound) state.alarmSound = persisted.alarmSound;
  if(persisted.stopwatch) Object.assign(state.stopwatch, persisted.stopwatch);
  if(typeof persisted.memo === 'string') state.memo = persisted.memo;
  if(persisted.music){
    const m = persisted.music;
    if(typeof m.shuffle === 'boolean') music.shuffle = m.shuffle;
    if(m.repeat === 'off' || m.repeat === 'all' || m.repeat === 'one') music.repeat = m.repeat;
    if(SPECTRUM_STYLES.some(s=>s.id === m.style)) music.style = m.style;
    if(typeof m.artBg === 'boolean') music.artBg = m.artBg;
  }
  if(Array.isArray(persisted.snoozeQueue)){
    /* 이미 지난 스누즈는 지금 와서 울려봐야 의미가 없으니 버린다 */
    state.snoozeQueue = persisted.snoozeQueue.filter(s=>s && s.at > Date.now());
  }
}

/* Set once the person erases everything. Saving is driven by a
   capture-phase listener on every click plus a pagehide handler, so
   without this the very next tap -- or simply closing the tab --
   would write the live state straight back into the key that was
   just removed. Cleared by the reload. */
let savingDisabled = false;

function saveState(){
  if(savingDisabled) return;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      use24h: state.use24h,
      showSeconds: state.showSeconds,
      showDate: state.showDate,
      flipped: state.flipped,
      animStyle: state.animStyle,
      timerMin: state.timerMin,
      timerSec: state.timerSec,
      timer: {
        total: state.timer.total, remaining: state.timer.remaining, endAt: state.timer.endAt,
        running: state.timer.running, paused: state.timer.paused, ringing: state.timer.ringing,
        sound: state.timer.sound
      },
      alarms: state.alarms.map(a=>({ id:a.id, hour:a.hour, min:a.min, sound:a.sound, enabled:a.enabled })),
      alarmHour: state.alarmHour, alarmMin: state.alarmMin, alarmSound: state.alarmSound,
      stopwatch: {
        running: state.stopwatch.running, elapsedMs: state.stopwatch.elapsedMs,
        startedAt: state.stopwatch.startedAt, laps: state.stopwatch.laps
      },
      memo: state.memo,
      /* The playlist itself is deliberately absent: File handles die
         with the page, so persisting names would only produce a list
         of tracks that cannot be played. */
      music: { shuffle:music.shuffle, repeat:music.repeat, style:music.style, artBg:music.artBg },
      snoozeQueue: state.snoozeQueue,
      bgMode: bgMode
    }));
  }catch(e){ /* 설정 저장 실패 — 조용히 무시 */ }
}
/* 배경 사진은 dataURL이라 혼자서도 쿼터를 넘길 수 있다. 같은 키에
   담으면 사진 하나 때문에 알람·타이머 설정까지 통째로 저장에
   실패하므로 별도 키로 분리한다. */
const BG_STORAGE_KEY = 'dynamicClock.bgImage';
function saveBgImage(dataUrl){
  if(savingDisabled) return true;
  try{
    if(dataUrl) localStorage.setItem(BG_STORAGE_KEY, dataUrl);
    else localStorage.removeItem(BG_STORAGE_KEY);
    return true;
  }catch(e){ return false; }
}
let saveDebounce = null;
function scheduleSave(){ clearTimeout(saveDebounce); saveDebounce = setTimeout(saveState, 250); }
/* 모든 상태 변화는 클릭/입력에서 시작되므로 캡처 단계에서 일괄 저장 예약 */
document.addEventListener('click', scheduleSave, true);
document.addEventListener('input', scheduleSave, true);
window.addEventListener('pagehide', saveState);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') saveState(); });

const SOUNDS = [
  { id:'classic', label:'클래식' },
  { id:'chime',   label:'차임' },
  { id:'pulse',   label:'펄스' },
  { id:'digital', label:'디지털' },
];

const ANIM_STYLES = [
  { id:'pop',   label:'팝' },
  { id:'flip',  label:'플립' },
  { id:'slide', label:'슬라이드' },
  { id:'none',  label:'없음' },
];

/* ================= Audio ================= */
let audioCtx = null;
function ctx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }

let currentSoundStop = null;

function beep(freq, dur, type, vol, when){
  const c = ctx();
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, when);
  gain.gain.linearRampToValueAtTime(vol, when+0.02);
  gain.gain.linearRampToValueAtTime(0, when+dur);
  osc.connect(gain); gain.connect(c.destination);
  osc.start(when); osc.stop(when+dur+0.02);
}

function playSound(id){
  stopSound();
  const c = ctx();
  let intervalMs;
  function loopStep(){
    const t = c.currentTime + 0.02;
    if(id==='classic'){ beep(880,0.15,'square',0.18,t); beep(880,0.15,'square',0.18,t+0.22); intervalMs=900; }
    else if(id==='chime'){ beep(523,0.18,'sine',0.16,t); beep(659,0.18,'sine',0.16,t+0.16); beep(784,0.22,'sine',0.16,t+0.32); intervalMs=1200; }
    else if(id==='pulse'){ beep(220,0.4,'triangle',0.2,t); intervalMs=650; }
    else { beep(1200,0.08,'sawtooth',0.14,t); beep(1200,0.08,'sawtooth',0.14,t+0.12); beep(1200,0.08,'sawtooth',0.14,t+0.24); intervalMs=700; }
  }
  loopStep();
  const iv = setInterval(loopStep, intervalMs || 900);
  currentSoundStop = ()=>clearInterval(iv);
}
function previewSound(id){
  const c = ctx();
  const t = c.currentTime + 0.02;
  if(id==='classic'){ beep(880,0.15,'square',0.18,t); }
  else if(id==='chime'){ beep(523,0.16,'sine',0.16,t); beep(659,0.16,'sine',0.16,t+0.14); }
  else if(id==='pulse'){ beep(220,0.35,'triangle',0.2,t); }
  else { beep(1200,0.08,'sawtooth',0.14,t); beep(1200,0.08,'sawtooth',0.14,t+0.12); }
}
function stopSound(){ if(currentSoundStop){ currentSoundStop(); currentSoundStop=null; } }

/* ================= Clock render ================= */
const clockEl = document.getElementById('clock');
const meridiemEl = document.getElementById('meridiem');
const dateLabelEl = document.getElementById('date-label');

function pad(n){ return n.toString().padStart(2,'0'); }

function renderClock(){
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  let ampm = '';
  if(!state.use24h){
    ampm = h >= 12 ? '오후' : '오전';
    h = h % 12; if(h===0) h = 12;
  }
  const hStr = pad(h), mStr = pad(m), sStr = pad(s);

  const prev = state.lastRendered;
  const parts = [
    {key:'h0', val:hStr[0]}, {key:'h1', val:hStr[1]},
    {key:'colon1', val:':', colon:true},
    {key:'m0', val:mStr[0]}, {key:'m1', val:mStr[1]},
  ];

  let html = '';
  parts.forEach(p=>{
    if(p.colon){ html += `<span class="char colon">${p.val}</span>`; return; }
    const changed = prev.full !== undefined && prev.full[p.key] !== p.val;
    html += `<span class="char${changed?' digit-change':''}" data-key="${p.key}">${p.val}</span>`;
  });

  if(state.showSeconds){
    const changedS0 = prev.full !== undefined && prev.full['s0'] !== sStr[0];
    const changedS1 = prev.full !== undefined && prev.full['s1'] !== sStr[1];
    html += `<span class="sec"><span class="char${changedS0?' digit-change':''}">${sStr[0]}</span><span class="char${changedS1?' digit-change':''}">${sStr[1]}</span></span>`;
  }

  clockEl.innerHTML = html;

  if(ampm !== prev.ampm){
    meridiemEl.textContent = ampm;
    retriggerAnim(meridiemEl);
  }
  prev.ampm = ampm;
  meridiemEl.style.display = ampm ? 'block' : 'none';

  if(state.showDate){
    const days = ['일','월','화','수','목','금','토'];
    const dateStr = `${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
    if(dateStr !== prev.dateStr){
      dateLabelEl.textContent = dateStr;
      retriggerAnim(dateLabelEl);
    }
    prev.dateStr = dateStr;
    dateLabelEl.style.display = 'block';
  } else {
    dateLabelEl.style.display = 'none';
  }

  state.lastRendered.full = { h0:hStr[0], h1:hStr[1], m0:mStr[0], m1:mStr[1], s0:sStr[0], s1:sStr[1] };

  return { h:now.getHours(), m, s };
}

function retriggerAnim(el){
  el.classList.remove('digit-change');
  void el.offsetWidth;
  el.classList.add('digit-change');
}

/* ================= Island (Dynamic Island) ================= */
const islandEl = document.getElementById('island');

function fmtMMSS(totalSec){
  totalSec = Math.max(0, Math.round(totalSec));
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return `${pad(m)}:${pad(s)}`;
}
function fmtStopwatch(ms){
  const totalCs = Math.floor(ms/100);
  const m = Math.floor(totalCs/600);
  const s = Math.floor((totalCs%600)/10);
  const d = totalCs%10;
  return `${pad(m)}:${pad(s)}.${d}`;
}

const ICON_PATHS = {
  alarm:     `<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>`,
  timer:     `<path d="M10 2h4"/><path d="M12 14v-4"/><circle cx="12" cy="14" r="8"/>`,
  stopwatch: `<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/><path d="M18 4l1.5 1.5"/>`,
  music:     `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`,
  ambient:   `<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2M21 12h1"/>`,
};
const RING_R = 15, RING_C = 2 * Math.PI * RING_R;

const PAUSE_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="4.5" width="4" height="15" rx="1.6"/><rect x="13.5" y="4.5" width="4" height="15" rx="1.6"/></svg>`;
const PLAY_SVG  = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 4.9v14.2a1 1 0 0 0 1.53.85l11.2-7.1a1 1 0 0 0 0-1.7L10.03 4.05A1 1 0 0 0 8.5 4.9z"/></svg>`;
const CLOSE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;

function ringSkeleton(iconName){
  return `<div class="ring-icon">
    <svg class="ring-svg" viewBox="0 0 34 34">
      <circle class="ring-track" cx="17" cy="17" r="${RING_R}"></circle>
      <circle class="ring-progress" id="ring-progress" cx="17" cy="17" r="${RING_R}" style="stroke-dasharray:${RING_C.toFixed(2)};"></circle>
    </svg>
    <svg class="island-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${ICON_PATHS[iconName]}</svg>
  </div>`;
}

function getTimerRemaining(){
  if(state.timer.running){
    return Math.max(0, (state.timer.endAt - Date.now()) / 1000);
  }
  return state.timer.remaining;
}

function getStopwatchElapsed(){
  return state.stopwatch.running
    ? state.stopwatch.elapsedMs + (Date.now() - state.stopwatch.startedAt)
    : state.stopwatch.elapsedMs;
}

function toggleStopwatchRun(){
  if(state.stopwatch.running){
    state.stopwatch.running = false;
    state.stopwatch.elapsedMs += Date.now() - state.stopwatch.startedAt;
  } else {
    state.stopwatch.running = true;
    state.stopwatch.startedAt = Date.now();
  }
  renderStopwatchPanel();
  renderIsland();
}
function resetStopwatch(){
  state.stopwatch.running = false;
  state.stopwatch.elapsedMs = 0;
  state.stopwatch.laps = [];
  islandExpanded = false;
  renderStopwatchPanel();
  renderIsland();
}

let islandMode = null;
let islandExpanded = false;
let islandExpandTimer = null;

function setIslandExpanded(val){
  islandExpanded = val;
  if(islandExpandTimer){ clearTimeout(islandExpandTimer); islandExpandTimer = null; }
  /* The music player is something you sit and look at -- collapsing
     it out from under the transport controls after five seconds
     would make it unusable. Everything else still auto-collapses. */
  const r0 = resolveIsland();
  if(val && r0.primary && r0.primary.kind !== 'music'){
    islandExpandTimer = setTimeout(()=>{ islandExpanded = false; islandMode = null; renderIsland(); }, 5000);
  }
  islandMode = null;
  renderIsland();
}

/* ================= Activity stack =================
   The pill used to show exactly one thing: a single mode function picked a
   winner and everything else vanished until it finished. Real live
   activities coexist -- the loser moves into a detached circle beside
   the pill (the "Separated" presentation) instead of disappearing.

   computeActivities returns every live activity in priority order.
   The first is the one driving the pill; the second gets the circle.
   Anything past that has nowhere to go and is simply not shown. */

const ACTIVITY_ORDER = ['alarm-ringing', 'timer-ringing', 'timer', 'music', 'stopwatch', 'ambient'];

function computeActivities(){
  const acts = [];
  const firing = state.alarms.find(a => a.firing);
  if(firing) acts.push({ kind:'alarm-ringing', id:firing.id, urgent:true });
  if(state.timer.ringing) acts.push({ kind:'timer-ringing', urgent:true });
  if(state.timer.running || state.timer.paused) acts.push({ kind:'timer' });
  if(music.index >= 0) acts.push({ kind:'music' });
  if(state.stopwatch.running || state.stopwatch.elapsedMs > 0) acts.push({ kind:'stopwatch' });
  if(ambient.on) acts.push({ kind:'ambient' });
  acts.sort((a,b) => ACTIVITY_ORDER.indexOf(a.kind) - ACTIVITY_ORDER.indexOf(b.kind));
  return acts;
}

/* Which activity the person last promoted by tapping the circle. It is
   a preference, not a guarantee: a ringing alarm always seizes the
   pill, and a kind that is no longer live falls back to the top of
   the list. */
let islandPreferred = null;

function resolveIsland(){
  const acts = computeActivities();
  const urgent = acts.find(a => a.urgent);

  /* Something ringing outranks an open panel. Checking the panel
     first would bury the alarm behind it, leaving no stop button and
     no way to silence the sound. */
  if(islandPanel && !urgent) return { mode:'panel-' + islandPanel, panel:islandPanel };
  if(mirrorOpen && !urgent)  return { mode:'mirror' };

  if(!acts.length) return { mode:'idle', acts:acts };

  let primary = urgent;
  if(!primary) primary = acts.find(a => a.kind === islandPreferred) || acts[0];
  const secondary = acts.find(a => a !== primary) || null;

  /* A ringing pill is already at its largest and carries its own
     buttons; there is no expanded form to go to. */
  const expandable = !primary.urgent;
  const expanded = expandable && islandExpanded;
  return {
    mode: primary.kind + (expanded ? '-expanded' : ''),
    primary: primary,
    secondary: secondary,
    acts: acts,
    expandable: expandable
  };
}

/* Rebuilding the DOM every frame would restart the entry animation and
   drop the camera stream, so the build only runs when this key moves. */
function islandKey(r){
  if(r.mode === 'idle' || r.mode === 'mirror' || r.panel) return r.mode;
  return r.mode + (r.primary.id != null ? ':' + r.primary.id : '');
}
function dotKey(r){
  if(!r.secondary || r.panel || r.mode === 'mirror') return 'none';
  return r.secondary.kind + (r.secondary.id != null ? ':' + r.secondary.id : '');
}

/* ================= Island panels =================
   Timer setup lives in Ultra; the alarm list and the stopwatch need
   room to scroll, so they get Full. These replaced the side sheets
   entirely -- the controls are the same, re-laid out for a pill. */
let islandPanel = null;   // 'timer' | 'alarm' | 'stopwatch' | null

function openIslandPanel(name){
  if(islandPanel === name){ closeIslandPanel(); return; }
  closePanel();                 // any side sheet that was open
  islandPanel = name;
  document.body.classList.add('island-panel-open');
  islandExpanded = false;
  if(islandExpandTimer){ clearTimeout(islandExpandTimer); islandExpandTimer = null; }
  overlay.classList.add('open');
  Object.keys(iconBtns).forEach(k => iconBtns[k].classList.toggle('on', k === name));
  islandMode = null;
  renderIsland();
}

/* Split out so renderIsland can evict a panel without recursing back
   through closeIslandPanel -> renderIsland. */
function teardownIslandPanel(){
  islandPanel = null;
  document.body.classList.remove('island-panel-open');
  overlay.classList.remove('open');
  Object.keys(iconBtns).forEach(k => iconBtns[k].classList.remove('on'));
}

function closeIslandPanel(){
  if(!islandPanel) return;
  teardownIslandPanel();
  islandMode = null;
  renderIsland();
}

/* ---- The detached circle ---- */
const islandDot = document.getElementById('island-dot');

function buildDotDOM(act){
  /* The contents are left in place on the way out: the circle shrinks
     to zero width over the pill's own duration, and emptying it here
     would blank it a frame into that animation. The next build
     replaces them anyway, and at width 0 with opacity 0 nothing shows
     through in the meantime. */
  if(!act){ islandDot.classList.remove('on'); islandDot.removeAttribute('aria-label'); return; }
  const icon = act.kind.indexOf('alarm') === 0 ? 'alarm'
             : act.kind.indexOf('timer') === 0 ? 'timer'
             : (ICON_PATHS[act.kind] ? act.kind : 'stopwatch');
  const t = music.tracks[music.index];
  const art = (act.kind === 'music' && t && t.art)
    ? `<div class="music-dot-art" style="background-image:url('${t.art}')"></div>` : '';
  islandDot.innerHTML = art + ringSkeleton(icon);
  islandDot.classList.add('on');
  islandDot.setAttribute('aria-label', dotLabel(act.kind) + '으로 전환');
}

function dotLabel(kind){
  if(kind.indexOf('alarm') === 0) return '알람';
  if(kind.indexOf('timer') === 0) return '타이머';
  if(kind === 'stopwatch') return '스톱워치';
  if(kind === 'music') return '음악';
  return '앰비언트';
}

/* The circle is too small for digits, so its whole readout is the
   ring: how much of the activity is left, or how loud the room is. */
function activityFraction(kind){
  if(kind.indexOf('timer') === 0){
    return state.timer.total > 0 ? getTimerRemaining() / state.timer.total : 0;
  }
  if(kind === 'stopwatch') return (getStopwatchElapsed() % 60000) / 60000;
  if(kind === 'music'){
    const d = music.el && isFinite(music.el.duration) ? music.el.duration : 0;
    return d ? (music.el.currentTime / d) : 0;
  }
  if(kind === 'ambient') return Math.min(1, ambient.level * 4);
  if(kind.indexOf('alarm') === 0) return 0.5 + 0.5 * Math.sin(Date.now()/1100);
  return 0;
}

function updateDotValues(act){
  if(!act) return;
  const ring = islandDot.querySelector('#ring-progress');
  if(ring) ring.style.strokeDashoffset = (RING_C * (1 - activityFraction(act.kind))).toFixed(2);
}

function updateIslandValues(r){
  const mode = r.mode;
  const ring = islandEl.querySelector('#ring-progress');
  const valueEl = islandEl.querySelector('#island-value');
  const pauseBtn = islandEl.querySelector('#island-pause-btn');

  if(mode === 'alarm-ringing' || mode === 'timer-ringing'){
    const breathe = 0.5 + 0.5 * Math.sin(Date.now()/1100);
    if(ring) ring.style.strokeDashoffset = (RING_C * (1 - breathe)).toFixed(2);
  } else if(mode === 'timer' || mode === 'timer-expanded'){
    const remaining = getTimerRemaining();
    const fraction = state.timer.total > 0 ? remaining / state.timer.total : 0;
    if(ring) ring.style.strokeDashoffset = (RING_C * (1 - fraction)).toFixed(2);
    if(valueEl) valueEl.textContent = fmtMMSS(Math.ceil(remaining));
    if(pauseBtn) setPauseBtn(pauseBtn, state.timer.running, 'timer');
  } else if(mode === 'music' || mode === 'music-expanded'){
    updateMusicIsland(mode === 'music-expanded');
  } else if(mode === 'ambient'){
    readAmbientLevel();
    updateWaveBars();
  } else if(mode === 'stopwatch' || mode === 'stopwatch-expanded'){
    const elapsed = getStopwatchElapsed();
    const fraction = (elapsed % 60000) / 60000;
    if(ring) ring.style.strokeDashoffset = (RING_C * (1 - fraction)).toFixed(2);
    if(valueEl) valueEl.textContent = fmtStopwatch(elapsed);
    if(pauseBtn) setPauseBtn(pauseBtn, state.stopwatch.running, 'stopwatch');
  } else if(mode === 'panel-stopwatch'){
    renderStopwatchPanel();
  }
}

/* Maps the spectrum onto the pill's bars. Reading straight from the
   analyser bins would put nearly all the motion in the first two
   bars, so the range is sampled on a curve instead. */
function updateWaveBars(){
  const wrap = islandEl.querySelector('#wave-bars');
  if(!wrap || !ambient.freq) return;
  const bars = wrap.children;
  const n = bars.length;
  const bins = ambient.freq.length;
  for(let i=0; i<n; i++){
    const from = Math.floor(Math.pow(i/n, 1.7) * bins * 0.72) + 1;
    const to = Math.max(from+1, Math.floor(Math.pow((i+1)/n, 1.7) * bins * 0.72) + 1);
    let sum = 0;
    for(let k=from; k<to; k++) sum += ambient.freq[k];
    const v = (sum/(to-from))/255;
    bars[i].style.height = (14 + Math.min(1, v*1.9) * 86).toFixed(0) + '%';
  }
}

/* The expanded control is an icon button, so swapping it means
   swapping the glyph — writing textContent here would wipe the SVG
   out and leave a bare word inside a 38px circle. Only touched when
   the state actually changes, since this runs every frame. */
function setPauseBtn(btn, running, kind){
  const want = running ? 'pause' : 'play';
  if(btn.dataset.glyph !== want){
    btn.dataset.glyph = want;
    btn.innerHTML = running ? PAUSE_SVG : PLAY_SVG;
    btn.setAttribute('aria-label', running ? '일시정지' : '재개');
  }
  btn.dataset.action = kind === 'timer'
    ? (running ? 'pause-timer' : 'resume-timer')
    : (running ? 'pause-stopwatch' : 'resume-stopwatch');
}

let islandDotMode = null;

function renderIsland(){
  /* Anything ringing evicts an open panel for good. Relying on the
     alarm's own fire path to do this left the panel state set, so
     dismissing the alarm sprang it straight back up. */
  if(islandPanel && computeActivities().some(a => a.urgent)){
    teardownIslandPanel();
    islandMode = null;
  }
  const r = resolveIsland();

  if(!r.expandable && islandExpanded){
    islandExpanded = false;
    if(islandExpandTimer){ clearTimeout(islandExpandTimer); islandExpandTimer = null; }
  }
  /* 알람/타이머 벨이 거울 패널을 밀어내면 카메라를 꺼 준다 */
  if(islandMode === 'mirror' && r.mode !== 'mirror'){
    mirrorOpen = false;
    document.body.classList.remove('mirror-open');
    stopMirrorCam();
  }
  document.body.classList.toggle('island-covers',
    r.mode.endsWith('-expanded') || r.mode.indexOf('panel-') === 0
    || r.mode === 'timer-ringing' || r.mode === 'alarm-ringing');
  document.body.classList.toggle('music-open', r.mode === 'music-expanded');

  const key = islandKey(r);
  if(key !== islandMode){
    islandMode = key;
    buildIslandDOM(r);
  }
  if(r.mode !== 'idle') updateIslandValues(r);

  const dKey = dotKey(r);
  if(dKey !== islandDotMode){
    islandDotMode = dKey;
    buildDotDOM(dKey === 'none' ? null : r.secondary);
  }
  if(r.secondary && !r.panel) updateDotValues(r.secondary);
}

/* Tapping the circle promotes it: the two activities trade places. */
islandDot.addEventListener('click', (e)=>{
  e.stopPropagation();
  const r = resolveIsland();
  if(!r.secondary) return;
  islandPreferred = r.secondary.kind;
  islandExpanded = false;
  renderIsland();
});

function pauseTimer(){
  if(!state.timer.running) return;
  state.timer.remaining = getTimerRemaining();
  state.timer.running = false;
  state.timer.paused = true;
  renderIsland();
}
function resumeTimer(){
  if(!state.timer.paused) return;
  state.timer.endAt = Date.now() + state.timer.remaining*1000;
  state.timer.paused = false;
  state.timer.running = true;
  renderIsland();
}
function cancelTimer(){
  state.timer.running = false;
  state.timer.paused = false;
  state.timer.remaining = 0;
  islandExpanded = false;
  renderIsland();
}

islandEl.addEventListener('click', (e)=>{
  e.stopPropagation();
  if(suppressNextClick){ suppressNextClick = false; return; }

  const btn = e.target.closest('[data-action]');
  if(btn){
    const action = btn.dataset.action;
    if(action==='stop-alarm'){ stopAlarm(btn.dataset.id); return; }
    if(action==='snooze'){ snoozeAlarm(btn.dataset.id); return; }
    if(action==='stop-timer'){ stopTimer(); return; }
    if(action==='snooze-timer'){ snoozeTimer(); return; }
    if(action==='expand'){ setIslandExpanded(true); return; }
    if(action==='pause-timer'){ pauseTimer(); return; }
    if(action==='resume-timer'){ resumeTimer(); return; }
    if(action==='cancel-timer'){ cancelTimer(); return; }
    if(action==='pause-stopwatch' || action==='resume-stopwatch'){ toggleStopwatchRun(); return; }
    if(action==='reset-stopwatch-island'){ resetStopwatch(); return; }
    if(action==='open-ambient'){ openAmbientScreen(); return; }
    if(action==='music-toggle'){ toggleMusic(); return; }
    if(action==='music-next'){ nextTrack(false); return; }
    if(action==='music-prev'){ prevTrack(); return; }
    if(action==='music-shuffle'){ music.shuffle = !music.shuffle; islandMode = null; renderIsland(); return; }
    if(action==='music-repeat'){
      music.repeat = music.repeat==='off' ? 'all' : (music.repeat==='all' ? 'one' : 'off');
      islandMode = null; renderIsland(); return;
    }
    if(action==='music-close'){ closeMusic(); return; }
    if(action==='toggle-art-bg'){
      /* Fired both by the switch in the music panel and by tapping the
         artwork in the expanded player. */
      music.artBg = !music.artBg;
      applyBgMode(); renderArtBgToggle(); scheduleSave(); return;
    }

    /* ---- Panel controls (formerly the side sheets) ---- */
    if(action==='close-panel'){ closeIslandPanel(); return; }
    if(action==='timer-adj'){ adjustTimer(btn.dataset.adj); return; }
    if(action==='alarm-adj'){ adjustAlarm(btn.dataset.adj); return; }
    if(action==='timer-start'){ startTimerFromPanel(); return; }
    if(action==='alarm-add'){ addAlarmFromPanel(); return; }
    if(action==='alarm-toggle'){ toggleAlarmEnabled(btn.dataset.id); return; }
    if(action==='alarm-delete'){ deleteAlarm(btn.dataset.id); return; }
    if(action==='pick-sound'){ pickSound(btn.dataset.scope, btn.dataset.sound); return; }
    if(action==='sw-toggle'){ toggleStopwatchRun(); renderStopwatchPanel(); return; }
    if(action==='sw-lap'){
      if(state.stopwatch.running){ state.stopwatch.laps.push(getStopwatchElapsed()); renderStopwatchPanel(); }
      return;
    }
    if(action==='sw-reset'){ resetStopwatch(); renderStopwatchPanel(); return; }
    if(action==='music-add'){ musicInput.click(); return; }
    if(action==='music-add-folder'){ musicFolderInput.click(); return; }
    if(action==='music-clear'){ clearTracks(); return; }
    if(action==='pick-spectrum'){
      music.style = btn.dataset.style;
      renderSpectrumChips();
      islandMode = null;
      renderIsland();
      return;
    }
    if(action==='play-track'){ playTrack(Number(btn.dataset.index)); return; }
    if(action==='remove-track'){ removeTrack(Number(btn.dataset.index)); return; }
  }
  const r = resolveIsland();
  if(r.panel) return;   // taps inside a panel are handled by its own controls
  /* On the weather screen the mirror panel would just stack a tiny
     weather block on top of a full weather screen, so a plain tap
     does nothing there. Live activities still expand. */
  if(r.mode === 'idle'){
    if(!weatherScreenOpen && !ambientScreenOpen) openMirror();
    return;
  }
  if(!islandExpanded && r.expandable) setIslandExpanded(true);
});

document.addEventListener('click', (e)=>{
  if(islandPanel) return;
  if(!islandExpanded && !mirrorOpen) return;
  const path = typeof e.composedPath === 'function' ? e.composedPath() : [];
  if(path.includes(islandEl)) return;
  if(islandExpanded) setIslandExpanded(false);
  if(mirrorOpen) closeMirror();
});

/* ================= Timer ================= */
function renderTimerStepper(){
  const minEl = islandEl.querySelector('#timer-min');
  const secEl = islandEl.querySelector('#timer-sec');
  if(minEl) minEl.textContent = pad(state.timerMin);
  if(secEl) secEl.textContent = pad(state.timerSec);
}

function adjustTimer(a){
  if(a==='min+') state.timerMin = Math.min(99, state.timerMin+1);
  if(a==='min-') state.timerMin = Math.max(0, state.timerMin-1);
  if(a==='sec+') state.timerSec = state.timerSec+5>=60 ? 0 : state.timerSec+5;
  if(a==='sec-') state.timerSec = state.timerSec-5<0 ? 55 : state.timerSec-5;
  renderTimerStepper();
}

/* Chips are rendered as markup with a data-action rather than wired
   with addEventListener, so a panel rebuild cannot leave dead
   buttons behind. The island's delegated click handler owns them. */
function soundChipsHTML(scope, selectedId){
  return SOUNDS.map(s=>
    `<button class="chip${s.id===selectedId ? ' selected' : ''}" data-action="pick-sound" data-scope="${scope}" data-sound="${s.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/></svg>${s.label}
    </button>`).join('');
}

function renderTimerSoundChips(){
  const box = islandEl.querySelector('#timer-sound-chips');
  if(box) box.innerHTML = soundChipsHTML('timer', state.timer.sound);
}
function renderAlarmSoundChips(){
  const box = islandEl.querySelector('#alarm-sound-chips');
  if(box) box.innerHTML = soundChipsHTML('alarm', state.alarmSound);
}

function pickSound(scope, id){
  previewSound(id);
  if(scope === 'timer'){ state.timer.sound = id; renderTimerSoundChips(); }
  else { state.alarmSound = id; renderAlarmSoundChips(); }
}

function startTimerFromPanel(){
  if(state.timer.running || state.timer.paused || state.timer.ringing) return;
  const total = state.timerMin*60 + state.timerSec;
  if(total<=0) return;
  state.timer.total = total;
  state.timer.remaining = total;
  state.timer.endAt = Date.now() + total*1000;
  state.timer.running = true;
  state.timer.paused = false;
  state.timer.ringing = false;
  /* Closing the panel drops the pill straight into the running timer
     activity, which is the whole point of moving this off a sheet. */
  closeIslandPanel();
}

function stopTimer(){
  state.timer.running = false;
  state.timer.paused = false;
  state.timer.ringing = false;
  state.timer.remaining = 0;
  stopSound();
  renderIsland();
}
function snoozeTimer(){
  state.timer.ringing = false;
  state.timer.running = true;
  state.timer.paused = false;
  state.timer.remaining = 60;
  state.timer.endAt = Date.now() + 60000;
  stopSound();
  renderIsland();
}

function renderAlarmStepper(){

  if(mEl) mEl.textContent = pad(state.alarmMin);
}

function adjustAlarm(a){
  if(a==='hour+') state.alarmHour = (state.alarmHour+1)%24;
  if(a==='hour-') state.alarmHour = (state.alarmHour+23)%24;
  if(a==='min+')  state.alarmMin  = (state.alarmMin+5)%60;
  if(a==='min-')  state.alarmMin  = (state.alarmMin+55)%60;
  renderAlarmStepper();
}

let alarmIdSeq = state.alarms.reduce((m,a)=>Math.max(m, a.id||0), 0) + 1;

function addAlarmFromPanel(){
  state.alarms.push({ id: alarmIdSeq++, hour: state.alarmHour, min: state.alarmMin, sound: state.alarmSound, enabled: true, firing:false });
  renderAlarmList();
}

function toggleAlarmEnabled(id){
  const a = state.alarms.find(x=>x.id===Number(id));
  if(a) a.enabled = !a.enabled;
  renderAlarmList();
}

function deleteAlarm(id){
  state.alarms = state.alarms.filter(x=>x.id!==Number(id));
  renderAlarmList();
}

function renderAlarmList(){
  const listEl = islandEl.querySelector('#alarm-list');
  if(!listEl) return;
  if(state.alarms.length===0){
    listEl.innerHTML = '<div class="field-label" style="text-align:center; padding:10px 0;">등록된 알람이 없습니다</div>';
    return;
  }
  listEl.innerHTML = state.alarms.slice()
    .sort((a,b)=> a.hour*60+a.min - (b.hour*60+b.min))
    .map(a=>{
      const soundLabel = (SOUNDS.find(s=>s.id===a.sound) || {}).label || '';
      return `<div class="alarm-item${a.enabled ? '' : ' disabled'}">
        <div>
          <div class="alarm-time">${pad(a.hour)}:${pad(a.min)}</div>
          <div class="alarm-sound">${soundLabel}</div>
        </div>
        <div class="alarm-actions">
          <div class="switch ${a.enabled?'on':''}" data-action="alarm-toggle" data-id="${a.id}"><div class="switch-knob"></div></div>
          <button class="delete-btn" data-action="alarm-delete" data-id="${a.id}" aria-label="알람 삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6h12z"/></svg></button>
        </div>
      </div>`;
    }).join('');
}

function stopAlarm(id){
  const a = state.alarms.find(x=>x.id===Number(id));
  if(a){ a.firing = false; }
  stopSound();
  renderIsland();
}
/* Snoozing must not rewrite the alarm itself — a 07:00 alarm has to
   still be a 07:00 alarm tomorrow. The re-fire is queued separately
   and checked in the tick loop. */
function snoozeAlarm(id){
  const a = state.alarms.find(x=>x.id===Number(id));
  if(a){
    a.firing = false;
    state.snoozeQueue = state.snoozeQueue.filter(s=>s.id !== a.id);
    state.snoozeQueue.push({ id: a.id, at: Date.now() + 5*60*1000, sound: a.sound });
  }
  stopSound();
  renderIsland();
  renderAlarmList();
}

/* ================= Music player =================
   Everything here works on files the person picks locally. That
   matters for one reason above all: a blob: URL is same-origin, so
   the browser lets createMediaElementSource tap it. A DRM-protected
   stream (Apple Music, Spotify) would hand back nothing but silence
   to an AnalyserNode, which is why the spectrum below has to be fed
   from local files to be real rather than decorative. */

const musicInput       = document.getElementById('music-input');
const musicFolderInput = document.getElementById('music-folder-input');
const dropHint         = document.getElementById('drop-hint');

music.el = new Audio();
music.el.preload = 'metadata';

/* ---------------------------------------------------------------
   Tag reading. No library: jsmediatags would be one more CDN
   dependency on a file that currently has exactly one, and the two
   container formats that matter here are short to parse by hand. */

function latin1(bytes, off, len){
  let s = '';
  for(let i=0; i<len; i++) s += String.fromCharCode(bytes[off+i]);
  return s;
}

function decodeBytes(bytes, label){
  try{ return new TextDecoder(label).decode(bytes).replace(/\0+$/,'').trim(); }
  catch(e){ return ''; }
}

/* ID3v2 lets a frame declare ISO-8859-1, and a great many Korean
   taggers write EUC-KR bytes under that declaration anyway. Decoding
   it literally yields mojibake, so anything with the high bit set
   gets a second pass through EUC-KR and is kept if that pass comes
   back clean. */
function decodeLatinish(bytes){
  let high = false;
  for(let i=0; i<bytes.length; i++){ if(bytes[i] >= 0x80){ high = true; break; } }
  if(high){
    const k = decodeBytes(bytes, 'euc-kr');
    if(k && k.indexOf('\uFFFD') === -1) return k;
  }
  return decodeBytes(bytes, 'iso-8859-1');
}

function decodeID3Text(bytes){
  if(!bytes.length) return '';
  const enc = bytes[0];
  const body = bytes.subarray(1);
  if(enc === 0) return decodeLatinish(body);
  if(enc === 1) return decodeBytes(body, 'utf-16');
  if(enc === 2) return decodeBytes(body, 'utf-16be');
  return decodeBytes(body, 'utf-8');
}

function synchsafe(b, o){
  return (b[o] << 21) | (b[o+1] << 14) | (b[o+2] << 7) | b[o+3];
}

function parseAPIC(bytes, ver){
  let p = 0;
  const enc = bytes[p++];
  let mime;
  if(ver === 2){
    mime = 'image/' + latin1(bytes, p, 3).toLowerCase().replace('jpg','jpeg');
    p += 3;
  } else {
    const s = p;
    while(p < bytes.length && bytes[p] !== 0) p++;
    mime = latin1(bytes, s, p - s).toLowerCase() || 'image/jpeg';
    p++;
  }
  p++; // picture type byte
  /* The description is terminated by one null in the single-byte
     encodings and by two in the UTF-16 ones. */
  if(enc === 1 || enc === 2){
    while(p + 1 < bytes.length && !(bytes[p] === 0 && bytes[p+1] === 0)) p += 2;
    p += 2;
  } else {
    while(p < bytes.length && bytes[p] !== 0) p++;
    p++;
  }
  if(p >= bytes.length) return null;
  if(mime.indexOf('image/') !== 0) mime = 'image/jpeg';
  return { mime: mime, data: bytes.subarray(p) };
}

function parseID3(buf){
  const u8 = new Uint8Array(buf);
  if(u8.length < 10) return null;
  if(u8[0] !== 0x49 || u8[1] !== 0x44 || u8[2] !== 0x33) return null; // 'ID3'
  const dv = new DataView(buf);
  const ver = u8[3];
  const flags = u8[5];
  const tagSize = synchsafe(u8, 6);
  const end = Math.min(10 + tagSize, u8.length);
  let pos = 10;
  if(flags & 0x40){
    pos += (ver === 4) ? synchsafe(u8, 10) : (dv.getUint32(10) + 4);
  }
  const out = {};
  const idLen = (ver === 2) ? 3 : 4;
  const hdrLen = (ver === 2) ? 6 : 10;
  while(pos + hdrLen <= end){
    const id = latin1(u8, pos, idLen);
    if(!/^[A-Z0-9]+$/.test(id)) break; // hit the padding
    let size;
    if(ver === 2){
      size = (u8[pos+3] << 16) | (u8[pos+4] << 8) | u8[pos+5];
    } else if(ver === 4){
      size = synchsafe(u8, pos + 4);
      /* Plenty of encoders stamp v2.4 but write plain 32-bit sizes.
         If the synchsafe reading runs past the tag, trust the plain
         one instead. */
      const plain = dv.getUint32(pos + 4);
      if(size > end - pos - hdrLen && plain <= end - pos - hdrLen) size = plain;
    } else {
      size = dv.getUint32(pos + 4);
    }
    pos += hdrLen;
    if(size <= 0 || pos + size > end) break;
    const frame = u8.subarray(pos, pos + size);
    if(id === 'TIT2' || id === 'TT2') out.title  = decodeID3Text(frame);
    else if(id === 'TPE1' || id === 'TP1') out.artist = decodeID3Text(frame);
    else if(id === 'TALB' || id === 'TAL') out.album  = decodeID3Text(frame);
    else if((id === 'APIC' || id === 'PIC') && !out.pic) out.pic = parseAPIC(frame, ver);
    pos += size;
  }
  return out;
}

/* MP4/M4A: walk the box tree down to moov > udta > meta > ilst. */
function parseMP4(buf){
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  const out = {};
  let found = false;

  function readItem(type, start, end){
    let p = start;
    while(p + 8 <= end){
      const size = dv.getUint32(p);
      const t = latin1(u8, p + 4, 4);
      if(size < 8 || p + size > end) break;
      if(t === 'data' && p + 16 <= end){
        const flag = dv.getUint32(p + 8) & 0xFFFFFF;
        const payload = u8.subarray(p + 16, p + size);
        if(type === '\u00a9nam') out.title  = decodeBytes(payload, 'utf-8');
        else if(type === '\u00a9ART') out.artist = decodeBytes(payload, 'utf-8');
        else if(type === '\u00a9alb') out.album  = decodeBytes(payload, 'utf-8');
        else if(type === 'covr' && !out.pic){
          out.pic = { mime: (flag === 14 ? 'image/png' : 'image/jpeg'), data: payload };
        }
        found = true;
        return;
      }
      p += size;
    }
  }

  function walk(start, end, parent, depth){
    if(depth > 6) return;
    let p = start;
    while(p + 8 <= end){
      let size = dv.getUint32(p);
      const type = latin1(u8, p + 4, 4);
      let hdr = 8;
      if(size === 1){
        if(p + 16 > end) break;
        size = dv.getUint32(p + 8) * 4294967296 + dv.getUint32(p + 12);
        hdr = 16;
      } else if(size === 0){
        size = end - p;
      }
      if(size < hdr || p + size > end) break;
      if(type === 'moov' || type === 'udta' || type === 'ilst'){
        walk(p + hdr, p + size, type, depth + 1);
      } else if(type === 'meta'){
        /* 'meta' is a full box: four version/flags bytes sit between
           the header and its children. */
        walk(p + hdr + 4, p + size, type, depth + 1);
      } else if(parent === 'ilst'){
        readItem(type, p + hdr, p + size);
      }
      p += size;
    }
  }

  walk(0, u8.length, null, 0);
  return found ? out : null;
}

function readTags(file){
  /* The tag block lives at the head of an MP3 and, for anything
     written by iTunes, near the head of an M4A too. Reading the whole
     file just to find it would mean holding a 60MB buffer per track,
     so cap it. */
  const CAP = 12 * 1024 * 1024;
  const blob = (file.size <= CAP) ? file : file.slice(0, CAP);
  return blob.arrayBuffer().then(buf=>{
    try{ return parseID3(buf) || parseMP4(buf) || {}; }
    catch(e){ return {}; }
  }).catch(()=>({}));
}

/* ---------------------------------------------------------------
   Playlist
   --------------------------------------------------------------- */

const AUDIO_RE = /\.(mp3|m4a|m4b|aac|mp4|flac|wav|wave|ogg|oga|opus|weba|webm)$/i;

function isAudioFile(f){
  return (f.type && f.type.indexOf('audio/') === 0) || AUDIO_RE.test(f.name || '');
}

function baseName(name){
  return String(name || '').replace(/\.[^.]+$/, '');
}

function addFiles(fileList){
  const files = Array.from(fileList || []).filter(isAudioFile);
  if(!files.length) return;
  /* Start playing the first file that was just added, but only when
     nothing is playing already: a drop should not interrupt
     something mid-song. */
  const startFrom = (music.index < 0) ? music.tracks.length : -1;
  files.sort((a,b)=>a.name.localeCompare(b.name, 'ko'));

  files.forEach(file=>{
    const track = {
      id: music.seq++,
      name: file.name,
      url: URL.createObjectURL(file),
      title: baseName(file.name),
      artist: '',
      album: '',
      art: null,
      duration: 0
    };
    music.tracks.push(track);
    /* Tags are read in the background: the list should appear the
       instant the files are picked, then fill in. */
    readTags(file).then(tags=>{
      if(tags.title)  track.title  = tags.title;
      if(tags.artist) track.artist = tags.artist;
      if(tags.album)  track.album  = tags.album;
      if(tags.pic && tags.pic.data && tags.pic.data.length > 100){
        try{
          track.art = URL.createObjectURL(new Blob([tags.pic.data], { type: tags.pic.mime }));
        }catch(e){}
      }
      renderTrackList();
      if(music.tracks[music.index] === track){
        islandMode = null;
        renderIsland();
        applyBgMode();
        updateMediaSession();
      }
    });
  });

  renderTrackList();
  if(startFrom >= 0) playTrack(startFrom);
}

function releaseTrack(t){
  try{ URL.revokeObjectURL(t.url); }catch(e){}
  if(t.art){ try{ URL.revokeObjectURL(t.art); }catch(e){} }
}

function clearTracks(){
  music.tracks.forEach(releaseTrack);
  music.tracks = [];
  closeMusic();
  renderTrackList();
}

function currentArtUrl(){
  const t = music.tracks[music.index];
  return (t && t.art) ? t.art : null;
}

/* ---------------------------------------------------------------
   Transport
   --------------------------------------------------------------- */

function ensureMusicGraph(){
  if(music.srcNode || music.graphFailed) return;
  /* A page opened straight off disk has an opaque origin, which makes
     every media resource -- bundled file, blob: URL, all of it --
     count as cross-origin. MediaElementAudioSourceNode answers that
     by outputting silence rather than throwing, so wiring the graph
     up here would trade the spectrum for the audio itself. Skip it
     and let the element play normally; serve the page over http to
     get the visualiser back. */
  if(location.protocol === 'file:'){
    music.graphFailed = true;
    return;
  }
  try{
    const c = ctx();
    music.srcNode = c.createMediaElementSource(music.el);
    music.analyser = c.createAnalyser();
    music.analyser.fftSize = 512;
    music.analyser.smoothingTimeConstant = 0.72;
    music.srcNode.connect(music.analyser);
    /* Routing through the graph replaces the element's own output,
       so this connection is what actually makes sound come out. */
    music.analyser.connect(c.destination);
    music.freq = new Uint8Array(music.analyser.frequencyBinCount);
    music.wave = new Uint8Array(music.analyser.fftSize);
  }catch(e){
    /* Some browsers refuse the tap. Better to lose the visualiser
       than the audio. */
    music.graphFailed = true;
    music.analyser = null;
  }
}

function playTrack(i){
  if(i < 0 || i >= music.tracks.length) return;
  ensureMusicGraph();
  music.index = i;
  music.el.src = music.tracks[i].url;
  music.el.play().catch(()=>{});
  islandMode = null;
  renderIsland();
  renderTrackList();
  applyBgMode();
  updateMediaSession();
}

function toggleMusic(){
  if(music.index < 0){
    if(music.tracks.length) playTrack(0);
    return;
  }
  if(music.el.paused){ ctx(); music.el.play().catch(()=>{}); }
  else music.el.pause();
}

function nextTrack(auto){
  const n = music.tracks.length;
  if(!n) return;
  if(auto && music.repeat === 'one'){
    music.el.currentTime = 0;
    music.el.play().catch(()=>{});
    return;
  }
  let i;
  if(music.shuffle && n > 1){
    do { i = Math.floor(Math.random() * n); } while(i === music.index);
  } else {
    i = music.index + 1;
    if(i >= n){
      /* Reaching the end of the list on its own is not the same as
         being told to go forwards: only the first one stops. */
      if(auto && music.repeat === 'off'){
        music.el.pause();
        music.el.currentTime = 0;
        music.playing = false;
        renderIsland();
        return;
      }
      i = 0;
    }
  }
  playTrack(i);
}

function prevTrack(){
  const n = music.tracks.length;
  if(!n) return;
  if(music.el.currentTime > 3){ music.el.currentTime = 0; return; }
  let i = music.index - 1;
  if(i < 0) i = n - 1;
  playTrack(i);
}

function closeMusic(){
  music.el.pause();
  music.el.removeAttribute('src');
  try{ music.el.load(); }catch(e){}
  music.index = -1;
  music.playing = false;
  islandExpanded = false;
  islandMode = null;
  document.body.classList.remove('music-open');
  applyBgMode();
  updateMediaSession();
  renderIsland();
  renderTrackList();
}

music.el.addEventListener('play', ()=>{
  music.playing = true;
  islandMode = null;
  renderIsland();
});
music.el.addEventListener('pause', ()=>{
  music.playing = false;
  renderIsland();
});
music.el.addEventListener('ended', ()=>{ nextTrack(true); });
music.el.addEventListener('loadedmetadata', ()=>{
  const t = music.tracks[music.index];
  if(t && isFinite(music.el.duration)) t.duration = music.el.duration;
  renderTrackList();
});
let decodeFailures = 0;
music.el.addEventListener('error', ()=>{
  /* A codec the browser cannot decode should not stall the queue --
     but skipping blindly would spin forever on a playlist where
     nothing is playable, so give up after one pass through it. */
  if(music.index < 0) return;
  decodeFailures++;
  if(decodeFailures >= music.tracks.length){
    decodeFailures = 0;
    music.playing = false;
    renderIsland();
    return;
  }
  if(music.tracks.length > 1) nextTrack(true);
});
music.el.addEventListener('playing', ()=>{ decodeFailures = 0; });

/* The alarm and the timer are the whole point of this app, so they
   take the speakers back when they go off. */
function duckMusicForAlarm(){
  if(music.playing) music.el.pause();
}

/* ---------------------------------------------------------------
   Spectrum
   --------------------------------------------------------------- */

function paintSpectrum(wrap){
  if(!wrap) return;
  const bars = wrap.children;
  const n = bars.length;
  if(!n) return;

  if(!music.analyser || !music.playing){
    for(let i=0; i<n; i++) bars[i].style.height = '10%';
    return;
  }

  if(music.style === 'wave'){
    music.analyser.getByteTimeDomainData(music.wave);
    const bins = music.wave.length;
    for(let i=0; i<n; i++){
      const from = Math.floor(i / n * bins);
      const to = Math.max(from + 1, Math.floor((i + 1) / n * bins));
      let peak = 0;
      for(let k=from; k<to; k++) peak = Math.max(peak, Math.abs(music.wave[k] - 128));
      bars[i].style.height = (8 + Math.min(1, (peak / 128) * 2.2) * 90).toFixed(0) + '%';
    }
    return;
  }

  music.analyser.getByteFrequencyData(music.freq);
  const bins = music.freq.length;
  /* Reading the bins linearly would pile almost all the movement into
     the first couple of bars, because that is where the energy of
     music actually sits. Sampling on a curve spreads it out. */
  const groups = (music.style === 'mirror') ? Math.ceil(n / 2) : n;
  const vals = new Array(groups);
  for(let i=0; i<groups; i++){
    const from = Math.floor(Math.pow(i / groups, 1.6) * bins * 0.7) + 1;
    const to = Math.max(from + 1, Math.floor(Math.pow((i + 1) / groups, 1.6) * bins * 0.7) + 1);
    let sum = 0;
    for(let k=from; k<to && k<bins; k++) sum += music.freq[k];
    vals[i] = (sum / (to - from)) / 255;
  }
  const centre = (n - 1) / 2;
  const ramped = wrap.dataset.ramp === '1';
  for(let i=0; i<n; i++){
    const v = (music.style === 'mirror')
      ? vals[Math.min(groups - 1, Math.round(Math.abs(i - centre)))]
      : vals[i];
    /* The pill's meter is shaped as well as driven: a ceiling that
       climbs across the row keeps the left end near a dot and lets
       only the right-hand bars reach full height, which is what the
       reference indicator does. The expanded panel is unshaped. */
    const ceiling = ramped ? (0.24 + 0.76 * Math.pow(i / (n - 1), 0.85)) : 1;
    const h = 10 + Math.min(1, v * 1.9) * 90 * ceiling;
    bars[i].style.height = h.toFixed(0) + '%';
  }
}

function updateMusicIsland(expanded){
  paintSpectrum(islandEl.querySelector(expanded ? '#music-bars' : '#music-mini-bars'));
  if(!expanded) return;
  const el = music.el;
  const dur = isFinite(el.duration) ? el.duration : 0;
  const cur = el.currentTime || 0;
  const fill = islandEl.querySelector('#music-bar-fill');
  if(fill) fill.style.width = (dur ? (cur / dur * 100) : 0).toFixed(2) + '%';
  const curEl = islandEl.querySelector('#music-cur');
  if(curEl) curEl.textContent = fmtMMSS(Math.floor(cur));
  const durEl = islandEl.querySelector('#music-dur');
  if(durEl) durEl.textContent = fmtMMSS(Math.floor(dur));
  const playBtn = islandEl.querySelector('#music-play-btn');
  if(playBtn){
    const want = music.playing ? 'pause' : 'play';
    if(playBtn.dataset.glyph !== want){
      playBtn.dataset.glyph = want;
      playBtn.innerHTML = music.playing ? PAUSE_SVG : PLAY_SVG;
      playBtn.setAttribute('aria-label', music.playing ? '일시정지' : '재생');
    }
  }
}

/* ---------------------------------------------------------------
   Lock screen / headphone buttons. Free, and it is the one piece of
   real OS integration a web page does get.
   --------------------------------------------------------------- */
function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  const t = music.tracks[music.index];
  try{
    if(!t){ navigator.mediaSession.metadata = null; return; }
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title || t.name,
      artist: t.artist || '',
      album: t.album || '',
      artwork: t.art ? [{ src: t.art, sizes: '512x512', type: 'image/jpeg' }] : []
    });
  }catch(e){}
}
if('mediaSession' in navigator){
  const handlers = {
    play: ()=>{ music.el.play().catch(()=>{}); },
    pause: ()=>music.el.pause(),
    nexttrack: ()=>nextTrack(false),
    previoustrack: ()=>prevTrack()
  };
  Object.keys(handlers).forEach(k=>{
    try{ navigator.mediaSession.setActionHandler(k, handlers[k]); }catch(e){}
  });
}

   Sheet
   --------------------------------------------------------------- */

/* Everything here is markup with a data-action rather than a node with
   a listener attached: the panel is rebuilt from scratch whenever the
   pill changes state, so bound handlers would not survive. */
function renderTrackList(){
  const listEl = islandEl.querySelector('#track-list');
  if(!listEl) return;
  if(!music.tracks.length){
    listEl.innerHTML = '<div class="track-empty">플레이리스트가 비어 있습니다.<br>아래 버튼으로 음악 파일을 추가하세요.</div>';
    return;
  }
  listEl.innerHTML = music.tracks.map((t, i)=>{
    const sub = [t.artist, t.album].filter(Boolean).join(' · ') || t.name;
    return `<div class="track-row${i === music.index ? ' current' : ''}" data-action="play-track" data-index="${i}">
      <div class="track-cover" ${t.art ? `style="background-image:url('${t.art}')"` : ''}>${t.art ? '' : NOTE_SVG}</div>
      <div class="track-meta">
        <div class="track-name">${esc(t.title)}</div>
        <div class="track-sub">${esc(sub)}</div>
      </div>
      <button class="delete-btn" data-action="remove-track" data-index="${i}" aria-label="목록에서 제거"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>`;
  }).join('');
}

function removeTrack(i){
  const t = music.tracks[i];
  if(!t) return;
  const wasCurrent = (i === music.index);
  releaseTrack(t);
  music.tracks.splice(i, 1);
  if(wasCurrent){
    if(music.tracks.length){
      music.index = Math.min(i, music.tracks.length - 1);
      playTrack(music.index);
    } else {
      closeMusic();
    }
  } else {
    if(i < music.index) music.index--;
    islandMode = null;
    renderIsland();
  }
  renderTrackList();
}

function renderSpectrumChips(){
  const box = islandEl.querySelector('#spectrum-chips');
  if(!box) return;
  box.innerHTML = SPECTRUM_STYLES.map(s=>
    `<button class="chip${s.id === music.style ? ' selected' : ''}" data-action="pick-spectrum" data-style="${s.id}">${s.label}</button>`
  ).join('');
}

function renderArtBgToggle(){
  const el = islandEl.querySelector('#toggle-art-bg');
  if(el) el.classList.toggle('on', music.artBg);
}

musicInput.addEventListener('change', ()=>{ addFiles(musicInput.files); musicInput.value = ''; });
musicFolderInput.addEventListener('change', ()=>{ addFiles(musicFolderInput.files); musicFolderInput.value = ''; });

/* Drag and drop over the whole window. dragleave fires constantly as
   the pointer crosses child elements, so the hint is driven by a
   counter rather than by the last event seen. */
let dragDepth = 0;
window.addEventListener('dragenter', (e)=>{
  e.preventDefault();
  dragDepth++;
  document.body.classList.add('dropping');
});
window.addEventListener('dragover', (e)=>{ e.preventDefault(); });
window.addEventListener('dragleave', ()=>{
  dragDepth = Math.max(0, dragDepth - 1);
  if(!dragDepth) document.body.classList.remove('dropping');
});
window.addEventListener('drop', (e)=>{
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dropping');
  if(e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
});

/* Nothing to draw until the panel exists — these are called from
   buildIslandDOM once it does. */

/* ================= Main tick loop ================= */
function tick(){
  const {h, m} = renderClock();

  if(state.timer.running && getTimerRemaining() <= 0){
    state.timer.remaining = 0;
    state.timer.running = false;
    state.timer.ringing = true;
    duckMusicForAlarm();
    playSound(state.timer.sound);
  }

  /* 스누즈 예약분 먼저 처리 */
  if(state.snoozeQueue.length){
    const due = Date.now();
    const stillWaiting = [];
    state.snoozeQueue.forEach(s=>{
      if(s.at <= due){
        const a = state.alarms.find(x=>x.id===s.id);
        if(a && a.enabled && !a.firing){ a.firing = true; duckMusicForAlarm(); playSound(s.sound); }
      } else {
        stillWaiting.push(s);
      }
    });
    state.snoozeQueue = stillWaiting;
  }

  const nowKey = h*60+m;
  if(nowKey !== state.lastMinuteChecked){
    state.lastMinuteChecked = nowKey;
    state.alarms.forEach(a=>{
      if(a.enabled && a.hour===h && a.min===m && !a.firing){
        a.firing = true;
        duckMusicForAlarm();
        playSound(a.sound);
      }
    });
  }
}

function islandAnimationFrame(){
  const ringingNow = state.timer.ringing || state.alarms.some(a=>a.firing);
  const musicLive = music.playing || (music.index >= 0 && islandExpanded);
  if(state.stopwatch.running || state.timer.running || ringingNow || ambient.on || musicLive){
    renderIsland();
  }
  /* The stopwatch panel is inside the pill now, so renderIsland
     already refreshes it every frame. */
  requestAnimationFrame(islandAnimationFrame);
}

setInterval(tick, 1000);
requestAnimationFrame(islandAnimationFrame);

renderClock();

const onboardDots  = document.getElementById('onboard-dots');
const onboardNext  = document.getElementById('onboard-next');
const onboardSkip  = document.getElementById('onboard-skip');

let onboardIndex = 0;
let onboardDone = null;   // what to run once the walkthrough closes

function renderOnboardPage(){
  const p = ONBOARD_PAGES[onboardIndex];
  onboardStage.classList.remove('enter');
  onboardStage.innerHTML = `
    <div class="onboard-art">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ONBOARD_ART[p.art]}</svg>
    </div>
    <div class="onboard-title">${p.title}</div>
    <div class="onboard-body">${p.body}</div>`;
  /* Reflow between removing and re-adding the class, or the animation
     will not restart on the next page. */
  void onboardStage.offsetWidth;
  onboardStage.classList.add('enter');

  onboardDots.innerHTML = ONBOARD_PAGES
    .map((_, i)=>`<i class="${i === onboardIndex ? 'on' : ''}"></i>`).join('');

  const last = onboardIndex === ONBOARD_PAGES.length - 1;
  onboardNext.textContent = last ? '시작하기' : '다음';
  onboardSkip.style.visibility = last ? 'hidden' : '';
}

function openOnboard(onDone){
  onboardIndex = 0;
  onboardDone = onDone || null;
  onboardEl.classList.add('open');
  renderOnboardPage();
}

function closeOnboard(){
  onboardEl.classList.remove('open');
  try{ localStorage.setItem(INTRO_SEEN_KEY, '1'); }catch(e){}
  const done = onboardDone;
  onboardDone = null;
  if(done) done();
}

onboardNext.addEventListener('click', ()=>{
  if(onboardIndex >= ONBOARD_PAGES.length - 1){ closeOnboard(); return; }
  onboardIndex++;

});

/* ================= Erase all data =================
   Every key this app writes, listed in one place so the reset cannot
   silently miss one that gets added later. */
const ALL_STORAGE_KEYS = [STORAGE_KEY, BG_STORAGE_KEY, INTRO_SEEN_KEY];

const eraseBtn  = document.getElementById('erase-data');
const eraseNote = document.getElementById('erase-note');
const ERASE_DEFAULT_NOTE = eraseNote.textContent;
let eraseArmed = null;

function disarmErase(){
  if(eraseArmed){ clearTimeout(eraseArmed); eraseArmed = null; }
  eraseBtn.classList.remove('armed');
  eraseBtn.textContent = '모든 데이터 삭제';
  eraseNote.textContent = ERASE_DEFAULT_NOTE;
}

function eraseEverything(){
  /* The debounced save is the real hazard here: it fires 250ms after
     the click that triggered this, and would write the live state
     straight back over what was just deleted. */
  clearTimeout(saveDebounce);
  saveDebounce = null;
  savingDisabled = true;

  ALL_STORAGE_KEYS.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });

  /* Wipe what is on screen too, so nothing survives in memory to be
     written back on the next input or on pagehide. */
  stopSound();
  closeMusic();
  clearTracks();
  state.alarms = [];
  state.snoozeQueue = [];
  state.memo = '';
  state.stopwatch.running = false;
  state.stopwatch.elapsedMs = 0;
  state.stopwatch.startedAt = 0;
  state.stopwatch.laps = [];
  state.timer.running = false;
  state.timer.paused = false;
  state.timer.ringing = false;
  state.timer.remaining = 0;
  customBgDataUrl = null;
  bgMode = 'black';
  applyBgMode();
  renderBgModeChips();
  islandMode = null;
  renderIsland();

  eraseBtn.classList.remove('armed');
  eraseBtn.classList.add('done');
  eraseBtn.textContent = '삭제되었습니다';
  eraseNote.textContent = '새로고침하면 처음 상태로 시작합니다.';
}

eraseBtn.addEventListener('click', ()=>{
  if(eraseBtn.classList.contains('done')) return;
  if(!eraseBtn.classList.contains('armed')){
    /* Arm rather than act. This is the only irreversible control in
       the app, so it should not fire on a single stray tap -- and it
       disarms itself rather than staying dangerous. */
    eraseBtn.classList.add('armed');
    eraseBtn.textContent = '한 번 더 누르면 삭제';
    eraseNote.textContent = '되돌릴 수 없습니다.';
    eraseArmed = setTimeout(disarmErase, 5000);
    return;
  }
  clearTimeout(eraseArmed);
  eraseArmed = null;
  eraseEverything();
});

/* Leaving the sheet cancels an armed button rather than leaving it

overlay.addEventListener('click', disarmErase);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', disarmErase));

/* ================= Island long-press ================= */
/* Idle: a single tap opens the mirror panel (handled in the click
   listener). While a timer, stopwatch or the music player is running
   the pill is already doing a job, so opening the panel needs a
   deliberate 550ms hold instead. */
let pressStartY = null;
let pressStartX = null;

islandEl.addEventListener('pointerdown', (e)=>{
  pressStartY = e.clientY;
  pressStartX = e.clientX;
  const base = resolveIsland();
  if(!base.panel && base.expandable){
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(()=>{
      longPressTimer = null;
      suppressNextClick = true;
      openMirror();
    }, 550);
  }
});
islandEl.addEventListener('pointermove', (e)=>{
  if(longPressTimer !== null && pressStartY !== null){
    if(Math.abs(e.clientY - pressStartY) > 12 || Math.abs(e.clientX - pressStartX) > 12){
      clearTimeout(longPressTimer); longPressTimer = null;
    }
  }
});
islandEl.addEventListener('pointerup', ()=>{
  clearTimeout(longPressTimer); longPressTimer = null;
  pressStartY = null; pressStartX = null;
});
islandEl.addEventListener('pointercancel', ()=>{

  pressStartY = null; pressStartX = null;

let mirrorOpen = false;
let mirrorStream = null;
let longPressTimer = null;
let suppressNextClick = false;

function openMirror(){
  if(mirrorOpen) return;
  if(islandEl.classList.contains('intro')) return;
  const base = resolveIsland();
  /* The mirror takes the whole pill, so it may only displace a calm
     activity -- never a panel and never something that is ringing. */
  if(base.panel) return;
  if(base.mode !== 'idle' && !base.expandable) return;
  mirrorOpen = true;
  islandMode = null;
  document.body.classList.add('mirror-open');
  renderIsland();
}
function closeMirror(){
  if(!mirrorOpen) return;
  mirrorOpen = false;
  stopMirrorCam();
  islandMode = null;
  document.body.classList.remove('mirror-open');
  renderIsland();
}
function startMirrorCam(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    const msg = islandEl.querySelector('.mirror-cam-msg');
    if(msg) msg.textContent = '카메라 사용 불가';
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
    .then(stream=>{
      /* 권한 응답을 기다리는 사이 패널이 닫혔으면 바로 반납 */
      if(!mirrorOpen){ stream.getTracks().forEach(t=>t.stop()); return; }
      mirrorStream = stream;
      const wrap = islandEl.querySelector('#mirror-cam-wrap');
      if(!wrap) return;
      const v = document.createElement('video');
      v.autoplay = true; v.muted = true; v.playsInline = true;
      v.setAttribute('playsinline','');
      v.srcObject = stream;
      wrap.innerHTML = '';
      wrap.appendChild(v);
    })
    .catch(()=>{
      const msg = islandEl.querySelector('.mirror-cam-msg');
      if(msg) msg.textContent = '카메라 권한 필요';
    });
}
function stopMirrorCam(){
  if(mirrorStream){
    mirrorStream.getTracks().forEach(t=>t.stop());
    mirrorStream = null;
  }
}

let cachedWeather = null;
let weatherFetchPromise = null;

function reverseGeocode(lat, lon){
  return fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`)
    .then(r=>r.json())
    .then(d=>{
      const parts = [d.city || d.locality, d.principalSubdivision].filter(Boolean);
      return parts.length ? parts[0] : null;
    })
    .catch(()=>null);
}

function prefetchWeather(){
  if(weatherFetchPromise) return weatherFetchPromise;
  weatherFetchPromise = new Promise((resolve)=>{
    if(!navigator.geolocation){
      cachedWeather = { error: true, reason: 'unsupported' };
      resolve(cachedWeather);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        const { latitude, longitude } = pos.coords;
        const url = 'https://api.open-meteo.com/v1/forecast'
          + `?latitude=${latitude}&longitude=${longitude}`
          + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m'
          + '&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset'
          + '&timezone=auto&forecast_days=1';
        Promise.all([ fetch(url).then(r=>r.json()), reverseGeocode(latitude, longitude) ])
          .then(([data, place])=>{
            const cur = data.current, day = data.daily;
            if(!cur) throw new Error('no data');
            cachedWeather = {
              temp: Math.round(cur.temperature_2m),
              feels: Math.round(cur.apparent_temperature),
              humidity: Math.round(cur.relative_humidity_2m),
              wind: Math.round(cur.wind_speed_10m),
              code: cur.weather_code,
              max: day ? Math.round(day.temperature_2m_max[0]) : null,
              min: day ? Math.round(day.temperature_2m_min[0]) : null,
              sunrise: day && day.sunrise ? day.sunrise[0] : null,
              sunset:  day && day.sunset  ? day.sunset[0]  : null,
              place: place || `${latitude.toFixed(2)}°, ${longitude.toFixed(2)}°`
            };
            resolve(cachedWeather);
          })
          .catch(()=>{
            cachedWeather = { error: true, reason: 'fetch' };
            resolve(cachedWeather);
          });
      },
      ()=>{
        cachedWeather = { error: true, reason: 'permission' };
        resolve(cachedWeather);
      },
      { timeout: 12000, maximumAge: 600000 }
    );
  });
  return weatherFetchPromise;
}

function weatherErrorText(reason){
  if(reason === 'permission') return '위치 권한이 꺼져 있습니다';
  if(reason === 'unsupported') return '이 브라우저는 위치를 지원하지 않습니다';
  return '날씨를 불러오지 못했습니다';
}

/* Long-pressing the weather block opens the full weather screen.
   This works even when the weather failed to load: the screen has
   an error state that explains what went wrong, and silently
   swallowing the gesture just makes the app feel broken. Sandboxed
   previews and iframes commonly block geolocation, which is exactly
   when the person most needs to be told why. */
function bindWeatherLongPress(){
  const el = islandEl.querySelector('#mirror-weather');
  if(!el) return;
  let timer = null, sx = 0, sy = 0;
  const cancel = ()=>{ clearTimeout(timer); timer = null; el.classList.remove('holding'); };
  el.addEventListener('pointerdown', (e)=>{
    sx = e.clientX; sy = e.clientY;
    el.classList.add('holding');
    timer = setTimeout(()=>{
      timer = null;
      el.classList.remove('holding');
      suppressNextClick = true;
      /* The pill is rebuilt as we open, so the click that follows
         this press may never reach it and clear the flag. Drop it
         on a timer so the next real tap isn't swallowed. */
      setTimeout(()=>{ suppressNextClick = false; }, 400);
      openWeatherScreen();
    }, 550);
  });
  el.addEventListener('pointermove', (e)=>{
    if(timer !== null && (Math.abs(e.clientX-sx) > 12 || Math.abs(e.clientY-sy) > 12)) cancel();
  });
  el.addEventListener('pointerup', cancel);
  el.addEventListener('pointercancel', cancel);
  el.addEventListener('pointerleave', cancel);
}

function pad2(n){ return String(n).padStart(2,'0'); }
function fmtClockTime(iso){
  if(!iso) return '--:--';
  const d = new Date(iso);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

/* Which sky to paint. Uses the real sunrise/sunset when we have it
   and falls back to the clock when we don't. */
function skyBand(w){
  const now = Date.now();
  if(w && w.sunrise && w.sunset){
    const rise = new Date(w.sunrise).getTime();
    const set  = new Date(w.sunset).getTime();
    const edge = 60 * 60 * 1000;
    if(now >= rise - edge && now <= rise + edge) return 'dawn';
    if(now >= set - edge && now <= set + edge) return 'dusk';
    if(now > rise && now < set) return 'day';
    return 'night';
  }
  const h = new Date().getHours();
  if(h >= 5 && h < 8) return 'dawn';
  if(h >= 8 && h < 17) return 'day';
  if(h >= 17 && h < 20) return 'dusk';
  return 'night';
}

function buildStars(){
  if(starsEl.childElementCount) return;
  let html = '';
  for(let i=0; i<60; i++){
    const size = (Math.random() * 1.8 + 0.9).toFixed(2);
    html += `<i class="star" style="
      left:${(Math.random()*100).toFixed(2)}%;
      top:${(Math.random()*62).toFixed(2)}%;
      width:${size}px; height:${size}px;
      --dur:${(Math.random()*3.5+2.5).toFixed(2)}s;
      --delay:${(Math.random()*4).toFixed(2)}s;"></i>`;
  }
  starsEl.innerHTML = html;
}

/* How far through the daylight span we are, 0 at sunrise and 1 at
   sunset. Drives both the arc marker and where the sun sits. */
function daylightFraction(w){
  if(!w || !w.sunrise || !w.sunset) return null;
  const rise = new Date(w.sunrise).getTime();
  const set  = new Date(w.sunset).getTime();
  if(set <= rise) return null;
  return Math.min(1, Math.max(0, (Date.now() - rise) / (set - rise)));
}

function renderCelestial(band, w){
  const night = (band === 'night');
  if(night){
    /* Craters are fixed, not random, so the moon looks like the
       same moon every time rather than re-rolling on each open. */
    const craters = [
      [22,26,26], [56,18,15], [34,58,20], [64,52,12], [46,38,9], [70,72,10]
    ];
    celestialEl.style.left = '76%';
    celestialEl.style.top = '22%';
    celestialEl.innerHTML = `<div class="moon-glow"></div><div class="moon-body">`
      + craters.map(([x,y,s])=>`<i class="crater" style="left:${x}%;top:${y}%;width:${s}%;height:${s}%"></i>`).join('')
      + `</div>`;
  } else {
    /* The sun rides the same arc the sunrise/sunset card draws:
       low and left at dawn, high at midday, low and right at dusk.
       Without this it floats at noon height during a sunset, which
       contradicts the card right below it. */
    const frac = daylightFraction(w);
    if(frac === null){
      celestialEl.style.left = '76%';
      celestialEl.style.top = '22%';
    } else {
      celestialEl.style.left = (16 + frac * 68).toFixed(1) + '%';
      celestialEl.style.top = (38 - 18 * Math.sin(Math.PI * frac)).toFixed(1) + '%';
    }
    celestialEl.innerHTML = `<div class="sun-corona"></div><div class="sun-corona two"></div><div class="sun-body"></div>`;
  }
  requestAnimationFrame(()=>celestialEl.classList.remove('hidden'));
}

function sunArcCard(w){
  const hasTimes = w.sunrise && w.sunset;
  let frac = 0, isNight = true;
  if(hasTimes){
    const rise = new Date(w.sunrise).getTime();
    const set  = new Date(w.sunset).getTime();
    const now  = Date.now();
    if(now >= rise && now <= set){
      frac = (now - rise) / (set - rise);
      isNight = false;
    } else {
      frac = now < rise ? 0 : 1;
    }
  }
  return `
    <div class="glass-card card-sun" style="animation-delay:.18s">
      <div class="card-label">일출 · 일몰</div>
      <div class="sun-arc-wrap">
        <svg class="sun-arc" viewBox="0 0 300 86" preserveAspectRatio="none" aria-hidden="true">
          <path class="arc-track" d="M 12 78 Q 150 -12 288 78"/>
          <path class="arc-done" id="arc-done" pathLength="100"
                d="M 12 78 Q 150 -12 288 78"
                stroke-dasharray="${(frac*100).toFixed(1)} 100"/>
          <circle class="arc-dot${isNight?' night':''}" id="arc-dot" r="5" cx="12" cy="78"/>
        </svg>
      </div>
      <div class="sun-times">
        <span>일출 <b>${fmtClockTime(w.sunrise)}</b></span>
        <span>일몰 <b>${fmtClockTime(w.sunset)}</b></span>
      </div>
    </div>`;
}

/* Every glass card gets the same two backdrop layers, so they're
   injected here rather than repeated in each card's markup. */
function addGlassLayers(){
  weatherCards.querySelectorAll('.glass-card').forEach(card=>{
    if(card.querySelector('.g-blur')) return;
    card.insertAdjacentHTML('afterbegin', '<span class="g-blur"></span><span class="g-rim"></span>');
  });
}

function renderWeatherScreen(){
  const w = cachedWeather;
  if(!w || w.error){
    weatherScreen.dataset.sky = skyBand(null);
    renderCelestial(weatherScreen.dataset.sky, null);
    document.getElementById('weather-place').textContent = '위치 확인 안 됨';
    document.getElementById('weather-subline').textContent = '';
    weatherCards.innerHTML = `<div class="glass-card"><div class="weather-error">
      ${w ? weatherErrorText(w.reason) : '날씨를 불러오지 못했습니다'}<br>
      미리보기 창에서는 위치 접근이 막혀 있을 수 있습니다.<br>
      파일을 브라우저에서 직접 열면 권한을 물어봅니다.
      <button class="ghost-btn retry-btn" id="weather-retry">다시 시도</button>
    </div></div>`;
    addGlassLayers();
    const retry = document.getElementById('weather-retry');
    if(retry) retry.addEventListener('click', ()=>{
      retry.textContent = '불러오는 중...';
      retry.disabled = true;
      cachedWeather = null;
      weatherFetchPromise = null;
      prefetchWeather().then(()=>renderWeatherScreen());
    });
    return;
  }

  const band = skyBand(w);
  weatherScreen.dataset.sky = band;
  buildStars();
  renderCelestial(band, w);

  const now = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('weather-place').textContent = w.place;
  document.getElementById('weather-subline').textContent =
    `${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일 · ${pad2(now.getHours())}:${pad2(now.getMinutes())} 기준`;

  weatherCards.innerHTML = `
    <div class="glass-card card-temp" style="animation-delay:.05s">
      <div class="card-label">현재 기온</div>
      <div class="temp-main">
        <div class="temp-value">${w.temp}°</div>
        <svg class="temp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${weatherIconSvg(w.code)}</svg>
      </div>
      <div class="temp-range">
        ${w.max !== null ? `<span>최고 <b>${w.max}°</b></span><span>최저 <b>${w.min}°</b></span>` : ''}
        <span>체감 <b>${w.feels}°</b></span>
      </div>
    </div>
    <div class="weather-row">
      <div class="glass-card card-cond" style="animation-delay:.12s">
        <div class="card-label">기상 상태</div>
        <div class="cond-value">${weatherDesc(w.code)}</div>
        <div class="cond-note">${weatherNote(w.code, w.temp)}</div>
      </div>
      ${sunArcCard(w)}
    </div>
    <div class="glass-card card-detail" style="animation-delay:.24s">
      <div class="detail-grid">
        <div class="detail-item"><span class="card-label">습도</span><span class="detail-val">${w.humidity}%</span></div>
        <div class="detail-item"><span class="card-label">바람</span><span class="detail-val">${w.wind} km/h</span></div>
        <div class="detail-item"><span class="card-label">체감</span><span class="detail-val">${w.feels}°</span></div>
      </div>
    </div>`;

  addGlassLayers();

  /* Place the marker by real arc length so it always sits on the
     curve, not on the Bezier's parameter approximation. */
  const donePath = document.getElementById('arc-done');
  const dot = document.getElementById('arc-dot');
  if(donePath && dot){
    const dash = parseFloat(donePath.getAttribute('stroke-dasharray')) || 0;
    const total = donePath.getTotalLength();
    const pt = donePath.getPointAtLength(total * (dash/100));
    dot.setAttribute('cx', pt.x);
    dot.setAttribute('cy', pt.y);
  }
}

function openWeatherScreen(){

  weatherScreenOpen = true;
